<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pantalles i cervell · Defensa TR</title>
<style>
:root{--bg:#07111f;--panel:#101f32;--panel2:#142941;--cyan:#55d9ef;--green:#a7ef69;--muted:#a9bacb;--white:#f4f8fc;--line:#28425c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 15%,#12324a 0,transparent 38%),var(--bg);color:var(--white);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
#app{min-height:100vh;display:flex;flex-direction:column}.top{height:54px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #20364c;background:#07111fcc}
.brand{font-size:13px;letter-spacing:.16em;color:var(--cyan);font-weight:800}.counter{font-size:12px;color:var(--muted)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 5vw 80px;overflow:auto}
.slide{width:min(1200px,100%);min-height:min(680px,calc(100vh - 150px));display:grid;grid-template-columns:1.04fr .96fr;gap:36px;align-items:center;animation:in .28s ease}
.slide.single{grid-template-columns:1fr}.eyebrow{font-size:12px;letter-spacing:.17em;color:var(--green);font-weight:800;text-transform:uppercase;margin-bottom:16px}
h1{font-size:clamp(38px,5.6vw,76px);line-height:1.02;letter-spacing:-.045em;margin:0 0 20px}h2{font-size:clamp(28px,3.4vw,48px);line-height:1.08;letter-spacing:-.035em;margin:0 0 18px}
p{font-size:clamp(16px,1.5vw,20px);line-height:1.55;color:#d2deea;margin:0 0 18px}.muted{color:var(--muted);font-size:14px}.hero-img{width:100%;max-height:490px;object-fit:contain;border-radius:18px;border:1px solid #29435a;background:#0a1726;box-shadow:0 25px 80px #0008}
.panel{background:linear-gradient(145deg,#132a40,#0c1a2b);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 18px 55px #0005}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#13283c;border:1px solid #2b4862;border-radius:14px;padding:17px;text-align:left;color:var(--white);cursor:pointer;transition:.18s}.card:hover,.card:focus{transform:translateY(-3px);border-color:var(--cyan);outline:none;background:#19364e}.card b{display:block;color:var(--green);font-size:13px;letter-spacing:.05em;margin-bottom:7px}.card span{color:#d4e0eb;font-size:14px;line-height:1.4}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:1px solid #3c657e;border-radius:999px;padding:12px 18px;background:#14334a;color:white;font-weight:750;cursor:pointer;text-decoration:none}.btn.primary{background:var(--green);border-color:var(--green);color:#102017}.btn:hover{filter:brightness(1.12)}
.kicker{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.stat{font-size:clamp(38px,5vw,64px);font-weight:850;color:var(--green);letter-spacing:-.05em}.statbox{padding:18px;border-radius:16px;background:#10253a;border:1px solid var(--line)}
.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid #35536c;background:#102338;border-radius:99px;padding:8px 12px;font-size:12px;color:#d6e8f5}
.footer{position:fixed;bottom:0;left:0;right:0;height:64px;background:#07111feF;border-top:1px solid #20364c;display:flex;align-items:center;justify-content:center;gap:12px;z-index:5}.footer button{min-width:42px}.progress{position:absolute;left:0;top:-2px;height:3px;background:var(--green);transition:width .2s}
.modal{position:fixed;inset:0;background:#020811cc;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modalbox{width:min(560px,100%);background:#10243a;border:1px solid #4a718b;border-radius:20px;padding:26px;box-shadow:0 25px 90px #000b}.modalbox h3{margin:0 0 12px;color:var(--green);font-size:22px}.modalbox p{font-size:16px}.close{float:right}
.hotspot-wrap{position:relative}.hotspot{position:absolute;border:2px solid var(--green);background:#a7ef6940;border-radius:50%;width:28px;height:28px;cursor:pointer;box-shadow:0 0 20px #a7ef69aa}
.bar{height:9px;background:#243d55;border-radius:20px;overflow:hidden;margin:8px 0 16px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green))}
.small{font-size:12px!important;color:var(--muted)!important}.slide-no{color:#66829b;font-size:12px;margin-top:22px}
@keyframes in{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:760px){body{overflow:auto}.top{padding:0 14px}main{padding:20px 16px 90px}.slide{grid-template-columns:1fr;gap:20px;min-height:auto}.hero-img{max-height:280px}.grid{grid-template-columns:1fr 1fr}.panel{padding:18px}h1{font-size:42px}}
</style></head><body><div id="app"><header class="top"><div class="brand">FOCUSMEMORY · RECERCA</div><div class="counter" id="counter">01 / 28</div></header><main id="stage"></main><footer class="footer"><div class="progress" id="progress"></div><button class="btn" onclick="prev()">←</button><button class="btn" onclick="toggleOverview()">☷ Índex</button><button class="btn" onclick="toggleFull()">⛶ Pantalla completa</button><button class="btn primary" onclick="next()">Següent →</button></footer></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><button class="btn close" onclick="closeModal()">Tancar ✕</button><h3 id="mt"></h3><p id="mb"></p></div></div>
<script>
const A="assets/";
const appURL="https://melhayanib-commits.github.io/MoahPF/";
const slides=[
{e:"DEFENSA DEL TREBALL DE RECERCA",t:"PANTALLES<br>I CERVELL",p:"L’impacte neurològic de les pantalles durant l’adolescència",img:"image1.png",tag:["RECERCA + PROJECTE REAL","FOCUSMEMORY · APLICACIÓ PRÒPIA"],buttons:[["Obrir FocusMemory",()=>window.open(appURL,"_blank")]]},
{e:"01 · PUNT DE PARTIDA",t:"Una situació que tots coneixem",p:"Imagina que estàs estudiant i arriba una notificació…",cards:[["LA MIRO","«Només serà un segon». La notificació introdueix un canvi de tasca i després cal recuperar el fil."],["LA IGNORO","Has aplicat una estratègia d’autocontrol: decidir conscientment on poses l’atenció."],["DEPÈN","El cansament, l’interès, el context i els hàbits poden canviar la manera com reaccionem."]],note:"Què ens fa tan difícil decidir? Clica una resposta."},
{e:"01 · PUNT DE PARTIDA",t:"La pregunta del treball",p:"Com pot influir l’ús excessiu de les pantalles en el cervell i el benestar dels adolescents?",cards:[["ATENCIÓ","Concentració i capacitat de mantenir el focus."],["RENDIMENT","Aprenentatge i rendiment acadèmic."],["BENESTAR","Emocions, descans i relacions."]],note:"Hipòtesi: depèn del temps d’ús i, sobretot, del tipus de contingut."},
{e:"02 · EL CERVELL ADOLESCENT",t:"Un cervell que encara s’està reorganitzant",p:"L’adolescència és una etapa de canvi, aprenentatge i plasticitat.",img:"image1.png",cards:[["PODA SINÀPTICA","Es reforcen connexions utilitzades."],["MIELINITZACIÓ","La informació circula amb més eficiència."],["PLASTICITAT","El cervell s’adapta a l’experiència."]],note:"Els hàbits repetits importen."},
{e:"02 · EL CERVELL ADOLESCENT",t:"El «fre» i l’accelerador no maduren alhora",p:"Durant l’adolescència, el sistema de recompensa pot tenir més pes abans que el control executiu acabi de madurar.",cards:[["CÒRTEX PREFRONTAL","Planificar, decidir i frenar impulsos."],["SISTEMA DE RECOMPENSA","Motivació, emocions i novetat."]]},
{e:"02 · EL CERVELL ADOLESCENT",t:"Quatre peces, quatre funcions",p:"Selecciona cada zona per descobrir-ne la funció.",img:"image1.png",hotspots:true,cards:[["CÒRTEX PREFRONTAL","Participa en la planificació, la presa de decisions i el control dels impulsos."],["SISTEMA LÍMBIC","Està relacionat amb les emocions, la motivació i el sistema de recompensa."],["AMÍGDALA","Participa en el processament de les emocions."],["HIPOCAMP","Té un paper fonamental en la memòria i l’aprenentatge."]]},
{e:"03 · DOPAMINA I RECOMPENSA",t:"El cicle de recompensa del mòbil",p:"Aquesta infografia és la que incloc al meu treball, a l’apartat 3.3. Clica cada fase.",img:"image3.png",cards:[["1 · NOTIFICACIÓ","Un estímul nou desperta la nostra atenció."],["2 · EXPECTATIVA","Volem saber què ha passat o què ens hem perdut."],["3 · RECOMPENSA","Rebem un missatge, un like o un contingut interessant."],["4 · REPETICIÓ","Aquesta experiència pot reforçar les ganes de tornar-ho a fer."]],extra:["Sabies que…?","La dopamina no és simplement l’hormona de la felicitat. També participa en la motivació, l’expectativa i l’aprenentatge."]},
{e:"03 · DOPAMINA I RECOMPENSA",t:"El que enganxa és no saber quan arribarà",p:"Les recompenses imprevisibles poden afavorir que repetim una conducta.",cards:[["NOVA NOTIFICACIÓ","Potser hi ha alguna cosa."],["CURIOSITAT","Vull comprovar-ho."],["RECOMPENSA","Missatge, like o vídeo."],["TORNAR-HI","La següent pot ser millor."]],note:"La dopamina no és «dolenta»: participa en la motivació i l’expectativa."},
{e:"04 · IMPACTE EN EL DIA A DIA",t:"No totes les pantalles són iguals",p:"No n’hi ha prou amb comptar hores: també cal mirar què fem, quan i per què.",cards:[["ÚS PASSIU","Scroll infinit, vídeos encadenats i consum sense objectiu clar."],["ÚS ACTIU","Crear, programar, buscar informació, aprendre i comunicar-se."]]},
{e:"05 · QUÈ DIUEN ELS ESTUDIS?",t:"Tres estudis que situen el problema",p:"No tots estudien exactament el mateix: són perspectives complementàries.",cards:[["614 ADOLESCENTS","Pérez de Albéniz et al. (2021): impulsivitat i ús excessiu del mòbil."],["+40.000 JOVES","UNICEF Espanya (2021): un 33% presentava indicadors d’ús problemàtic d’Internet."],["ASPB · FRESC (2021)","Dies lectius: noies 4,04 h i nois 3,33 h. Cap de setmana: noies 5,36 h i nois 4,48 h."]],note:"La mida de la mostra i el mètode condicionen què podem concloure."},
{e:"05 · ESTUDIS: ATENCIÓ",t:"Quan ens interrompen, recuperar el fil costa",p:"Mark, Gudith i Klocke (2008)",cards:[["48 PARTICIPANTS","Estudi sobre interrupcions durant tasques."],["MÉS PRESSA","Treballaven més ràpid per compensar."],["MÉS ESTRÈS","I més frustració."],["LÍMIT IMPORTANT","No era un estudi amb adolescents: és una pista sobre les interrupcions, no una prova directa sobre tots els adolescents."]]},
{e:"05 · ESTUDIS: MEMÒRIA",t:"La memòria necessita atenció… i descans",p:"Dues perspectives complementàries sobre com recordem.",cards:[["15 ESTUDIS","Kopasz et al. (2010): revisió sobre son i memòria."],["EFECTE GOOGLE","Sparrow, Liu i Wegner (2011): recordem també on trobar la informació."],["IDEA CLAU","Internet no elimina la memòria: pot canviar com la fem servir."]],note:"Interrupcions i menys descans poden dificultar el procés d’aprendre i recordar."},
{e:"05 · ESTUDIS: EMOCIONS",t:"FOMO: la por de perdre’t alguna cosa",p:"Comparar-nos i voler estar sempre al dia pot alimentar la necessitat de consultar el mòbil.",cards:[["951 ADOLESCENTS","Einstein, Dabb i Fraser (2023)."],["44%","A l’enquesta pròpia, la resposta més freqüent va ser «rarament» sentir FOMO."],["62% + 30%","El 92% creu que un ús molt intensiu pot tenir conseqüències negatives."]]},
{e:"05 · ESTUDIS: SON",t:"El mòbil a la nit: què diu l’estudi?",p:"Höhn et al. (2024): cal evitar simplificar els resultats.",cards:[["33 ADOLESCENTS I 35 ADULTS JOVES","Participants de l’estudi."],["90 MINUTS","Lectura al mòbil o en paper."],["RESULTAT","La llum sense filtre va reduir temporalment la melatonina; la memòria nocturna no va variar significativament."]],note:"La llum, el contingut i l’hora d’anar a dormir són factors diferents."},
{e:"06 · LA MEVA ENQUESTA",t:"Vaig preguntar a 51 persones",p:"És una mostra propera i limitada: serveix per observar hàbits, no per representar tots els adolescents.",stats:[["51","RESPOSTES"],["16–17","ANYS"],["5","TEMES"]],cards:[["PREGUNTES","Ús, son, notificacions, FOMO i percepció."]]},
{e:"06 · LA MEVA ENQUESTA",t:"Què va sortir? Tres dades molt clares",p:"Clica cada dada per veure què representa.",stats:[["58%","ÚS DE PANTALLES A L’ÚLTIMA HORA ABANS DE DORMIR"],["44%","ENTRE 2 I 4 H D’OCI AL DIA"],["92%","CREUEN QUE L’ÚS INTENSIU POT TENIR EFECTES NEGATIUS"]],note:"Dades extretes dels gràfics del meu qüestionari."},
{e:"06 · LECTURA CRÍTICA",t:"Què puc afirmar… i què no?",p:"Associació no és el mateix que causalitat.",cards:[["SÍ PUC DIR","En la meva mostra hi ha hàbits que coincideixen amb les preocupacions de la part teòrica."],["NO PUC DIR","Que les pantalles siguin l’única causa ni que 51 respostes representin tots els adolescents."]]},
{e:"07 · LA MEVA APLICACIÓ",t:"De la recerca a una eina pràctica",p:"No volia quedar-me només en la teoria. Per això vaig desenvolupar FocusMemory.",img:"image2.png",buttons:[["OBRIR FOCUSMEMORY",()=>window.open(appURL,"_blank")]]},
{e:"07 · FOCUSMEMORY",t:"Proves cognitives",p:"Exercicis per treballar diferents capacitats. Selecciona una prova.",img:"image6.png",cards:[["ATENCIÓ","Seleccionar estímuls."],["MEMÒRIA NUMÈRICA","Recordar xifres."],["MEMÒRIA VERBAL","Recordar paraules."],["SEQÜÈNCIES VISUALS","Reproduir patrons."]]},
{e:"07 · FOCUSMEMORY",t:"Les proves també es converteixen en jocs",p:"Mateixes capacitats, experiències diferents: memoritzar, observar i detectar canvis.",img:"image7.png",cards:[["TEMPLE DELS PATRONS","Cal recordar i reproduir seqüències visuals."],["VOLCÀ DELS NÚMEROS","Un repte per entrenar la memòria numèrica."],["ESTACIÓ 3D","Un entorn tridimensional on cal observar i detectar canvis."]],buttons:[["PROVAR ELS JOCS",()=>window.open(appURL,"_blank")]]},
{e:"07 · FOCUSMEMORY",t:"No només jugar: observar els hàbits",p:"Les eines complementàries permeten registrar i consultar informació.",img:"image10.png",cards:[["RESULTATS","Permet consultar les puntuacions i l’evolució."],["DIARI DIGITAL","Registra hàbits de son, pantalla, concentració i estat d’ànim."],["EXPERIMENT DE 7 DIES","Proposa petits reptes per prendre consciència dels hàbits digitals."]]},
{e:"07 · DESENVOLUPAMENT",t:"Què hi ha darrere de l’aplicació?",p:"El salt de 2D a 3D va implicar càmeres, llums, col·lisions, personatges, animacions i adaptació a mòbils.",cards:[["HTML · CSS · JS","Estructura, disseny i lògica."],["THREE.JS","Escenes tridimensionals."],["WEBGL","Gràfics al navegador."],["PWA","Experiència instal·lable."]],note:"Vaig aprendre sobretot a provar, detectar errors i tornar-ho a intentar."},
{e:"07 · DESENVOLUPAMENT",t:"FocusIA: explicar també els límits",p:"L’aplicació no diagnostica ni substitueix cap professional.",cards:[["FUNCIONS LOCALS","Analitzar resultats, proposar plans i generar exercicis."],["LIMITACIÓ","Per a preguntes obertes necessita el backend; ara no està completament connectada."]]},
{e:"08 · CONCLUSIONS",t:"Què he après?",p:"No es tracta de viure sense pantalles, sinó d’aprendre a utilitzar-les sense deixar que controlin el nostre temps, la nostra atenció i la nostra vida.",cards:[["NO ÉS TOT O RES","Les pantalles també poden ser útils."],["IMPORTA EL CONTEXT","Temps, contingut, moment i hàbits."],["CAL EQUILIBRI","Protegir son, atenció i relacions."]]},
{e:"09 · FINAL",t:"Ara podeu provar FocusMemory",p:"Escaneja el codi QR o clica el botó per obrir l’aplicació.",img:"image14.png",buttons:[["OBRIR L’APLICACIÓ",()=>window.open(appURL,"_blank")]],note:"Moltes gràcies. Teniu alguna pregunta?"},
{e:"INTERACCIÓ · PREGUNTA INICIAL",t:"Si has triat mirar-la",p:"La notificació introdueix un canvi de tasca. Després cal recuperar el fil del que estaves fent.",note:"IDEA CLAU · No és només voluntat: també hi intervenen els hàbits i el disseny de les aplicacions."},
{e:"INTERACCIÓ · PREGUNTA INICIAL",t:"Si has triat ignorar-la",p:"Has aplicat una estratègia d’autocontrol: decidir conscientment on poses l’atenció.",note:"IDEA CLAU · No és només voluntat: també hi intervenen els hàbits i el disseny de les aplicacions."},
{e:"INTERACCIÓ · PREGUNTA INICIAL",t:"Si has triat «depèn»",p:"El cansament, l’interès, el context i els hàbits poden canviar la manera com reaccionem.",note:"IDEA CLAU · No és només voluntat: també hi intervenen els hàbits i el disseny de les aplicacions."}
];
let idx=0;
function modal(t,b){document.getElementById('mt').textContent=t;document.getElementById('mb').textContent=b;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function render(){
 const s=slides[idx], stage=document.getElementById('stage');
 document.getElementById('counter').textContent=String(idx+1).padStart(2,'0')+" / "+slides.length;
 document.getElementById('progress').style.width=((idx+1)/slides.length*100)+"%";
 let left=`<section><div class="eyebrow">${s.e}</div><h2>${s.t}</h2><p>${s.p||""}</p>${s.note?`<p class="muted">${s.note}</p>`:""}`;
 if(s.tag)left+=`<div class="pills">${s.tag.map(x=>`<span class="pill">${x}</span>`).join("")}</div>`;
 if(s.cards)left+=`<div class="grid">${s.cards.map(c=>`<button class="card" onclick="modal(${JSON.stringify(c[0])},${JSON.stringify(c[1])})"><b>${c[0]}</b><span>${c[1]}</span></button>`).join("")}</div>`;
 if(s.stats)left+=`<div class="grid">${s.stats.map(c=>`<button class="statbox card" onclick="modal(${JSON.stringify(c[1])},${JSON.stringify(c[0]+" · Dada de l’enquesta pròpia.")})"><div class="stat">${c[0]}</div><span>${c[1]}</span></button>`).join("")}</div>`;
 if(s.extra)left+=`<div class="actions"><button class="btn" onclick="modal(${JSON.stringify(s.extra[0])},${JSON.stringify(s.extra[1])})">${s.extra[0]}</button></div>`;
 if(s.buttons)left+=`<div class="actions">${s.buttons.map((b,i)=>`<button class="btn primary" onclick="slides[${idx}].buttons[${i}][1]()">${b[0]}</button>`).join("")}</div>`;
 left+=`<div class="slide-no">${String(idx+1).padStart(2,"0")} · ${s.e}</div></section>`;
 let right=s.img?`<section class="hotspot-wrap"><img class="hero-img" src="${A+s.img}" alt="Imatge original de la presentació">`:"";
 if(s.hotspots)right+=`<button class="hotspot" style="top:20%;left:70%" onclick="modal('Còrtex prefrontal','Planificació, presa de decisions i control dels impulsos.')"></button><button class="hotspot" style="top:52%;left:35%" onclick="modal('Sistema límbic','Emocions, motivació i sistema de recompensa.')"></button><button class="hotspot" style="top:39%;left:55%" onclick="modal('Amígdala','Processament de les emocions.')"></button><button class="hotspot" style="top:60%;left:62%" onclick="modal('Hipocamp','Memòria i aprenentatge.')"></button>`;
 if(!s.img)right+=`<div class="panel"><div class="kicker">IDEA PRINCIPAL</div><div class="stat" style="font-size:38px">ATENCIÓ<br>MEMÒRIA<br>BENESTAR</div><p class="muted">Explora les targetes i participa en la presentació.</p></div>`;
 right+="</section>";
 stage.innerHTML=`<div class="slide ${s.img?"":"single"}">${left}${right}</div>`;
}
function next(){idx=Math.min(slides.length-1,idx+1);render()}function prev(){idx=Math.max(0,idx-1);render()}
function toggleFull(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
function toggleOverview(){modal("Índex de la presentació",slides.map((s,i)=>`${i+1}. ${s.t.replace(/<br>/g," ")}`).join("\n"))}
document.addEventListener('keydown',e=>{if(e.key==="ArrowRight"||e.key===" "){next()}if(e.key==="ArrowLeft"){prev()}if(e.key==="Escape"){closeModal()}});
render();
</script></body></html>
